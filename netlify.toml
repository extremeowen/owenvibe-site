# Конфігурація Netlify для сайту extremeowen
# publish = "." — сайт лежить прямо в корені репозиторію
# functions = "netlify/functions" — серверні функції (пересилання в Telegram)

[build]
  publish = "."
  functions = "netlify/functions"

# Node 20 для збірки й функцій
[build.environment]
  NODE_VERSION = "20"

# Безпечні заголовки
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Сервіс-воркер не має кешуватись, інакше оновлення сайту не долетить
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Не віддавати назовні службові файли репозиторію
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true
